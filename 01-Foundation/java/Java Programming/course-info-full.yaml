type: marketplace
title: Programmation Java
language: French
summary: |
  Ce cours est un support pour le cours de programmation (en Java) de la filière ISC à la HEIA-FR.
   Ce cours propose des exercices qui seront effectués en partie durant les heures de cours. Les exercices proposés ne remplacent pas les séries. Les exercices présentent des concepts théoriques à l'aide d'exemple, proposent des problèmes de programmation à résoudre et des réponses à amener à des questions (sous forme de choix multiples).
